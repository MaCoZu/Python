[project]
name = "scripts"
version = "0.1.0"
description = "Unified Scripts TUI - Dashboard for scripts and scrapers"
requires-python = ">=3.14"
dependencies = [
    "textual>=0.100.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.20",
    "httpx>=0.28.1",
    "pymupdf4llm>=0.3.4",
    "pypdf>=6.8.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "watchdog>=6.0.0",
    "youtube-transcript-api>=0.6.0",
]

[project.scripts]
scripts = "scripts.app:app"
