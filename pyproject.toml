[project]
name = "python-ds-learning"
version = "0.1.0"
description = "Python data science learning repository with NumPy, Pandas, and Matplotlib examples"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "marimo>=0.23.3",
    "altair>=6.0.0",
    "vega-datasets>=0.9.0",
    "pandasql>=0.7.3",
    "summarytools>=0.3.0",
    "skimpy>=0.0.20",
    "xlrd>=2.0.2",
    "nbqa>=1.9.1",
    "pre-commit>=4.5.1",
    "textual>=0.100.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.8.0",
    "country-converter>=1.3.2",
    "sympy>=1.14.0",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5.0", "xgboost>=2.1.0"]
viz = ["plotly>=5.24.0", "altair>=5.4.0"]
db = ["sqlalchemy>=2.0.0", "duckdb>=1.1.0"]
web = ["requests>=2.32.0", "beautifulsoup4>=4.12.0", "httpx>=0.27.0"]
dev = ["ruff>=0.8.0", "mypy>=1.13.0", "pytest>=8.3.0", "pre-commit>=4.0.0"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".venv",
    "__pycache__",
    "**/*.ipynb",
    "SCRIPTS/**",
    "NOTEBOOKS/**/statistician package/**",
    "DOCS",
]

[tool.ruff.lint]
# Disable most rules for learning files
extend-ignore = [
    "E402",  # top-level imports
    "E501",  # line too long
    "E501",  # long lines
    "F401",  # unused imports
    "F841",  # unused variables
    "N999",  # invalid module names
    "RUF003", # walrus operator
    "RUF005", # list concat
]

[tool.ruff.lint.per-file-ignores]
# Only strict rules for actual src code
"SRC/*" = []
"TOOLS/scraper/*" = ["RUF005"]
# Scraper uses list concatenation intentionally
"scraper/*.py" = ["RUF005", "W292", "I001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["python.*", "pandas.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "utils.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "duckdb>=1.4.4",
    "jupyterlab-code-formatter>=3.0.3",
    "mcp>=1",
    "nbqa>=1.9.1",
    "openai>=2.26.0",
    "polars[pyarrow]>=1.38.1",
    "pydantic>=2",
    "python-lsp-ruff>=2.3.0",
    "python-lsp-server>=1.14.0",
    "sqlglot>=29.0.1",
    "websockets>=16.0",
]
